# Question wordings for the jev-para3 arm, fixed before any arm of preregistration 2 answered an item.
# Variant 0 is the task's own question; options and descriptions are unchanged. Each keeps the same rules.
- "Using only the facts and rules in the text, is the statement true, false, or unknown? A statement is true if it can be derived from the facts and rules, and false if its negation can be derived. If neither the statement nor its negation can be derived, it is unknown. A rule applies only when all of its conditions are established; 'not' in a condition requires the negation to be stated or derived."
- "Judge the statement from the text's facts and rules alone. Answer true if the statement can be derived, false if its negation can be derived, and unknown if neither can. Apply a rule only when every one of its conditions is established, and treat a 'not' condition as established only when the negation is stated or derived."
- "Can the statement be proved from the given facts and rules? If the statement itself can be derived, it is true; if its negation can be derived, it is false; if neither can be derived, it is unknown. Rules fire only when all their conditions are established, and a condition with 'not' needs its negation stated or derived."
