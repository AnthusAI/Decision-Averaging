[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-averaging"
version = "0.1.0"
description = "Does asking a decision model for several classifications of one item in one request, and pooling them, make it more accurate or more stable?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml", "python-dotenv"]

[project.optional-dependencies]
jev = ["typesafe-sdk"]
emotion = ["datasets"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
da = "decision_averaging.cli:main"

[tool.setuptools.packages.find]
include = ["decision_averaging*"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["decision_averaging"]
asyncio_mode = "auto"
